name: Deploy Supabase

# Pushes migrations, Edge Functions and Storage files to the hosted project when main changes.
# Needs repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD, and a repo variable
# SUPABASE_PROJECT_ID (see docs/supabase.md). Skipped until SUPABASE_PROJECT_ID is set.

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

concurrency: deploy-supabase

jobs:
  deploy:
    if: vars.SUPABASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: npx supabase db push
      - run: npx supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - run: npx supabase seed buckets --project-ref "$SUPABASE_PROJECT_ID"
      - name: Advisors (report only)
        run: npx supabase db advisors --linked --fail-on none
